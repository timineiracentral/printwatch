# PrintWatch — Docker Compose (Fase 1: CUPS; Fase 2: backend)
# D-01/D-02: frontend e nginx entram nas Fases 4–5 — sem stubs ativos (D-03).

services:
  cups:
    build: ./cups
    ports:
      - "631:631"
    env_file: .env
    environment:
      ALLOWED_NETWORK: ${ALLOWED_NETWORK:-REDACTED_IP/16}
      CUPS_ADMIN_USER: ${CUPS_ADMIN_USER}
      CUPS_ADMIN_PASSWORD: ${CUPS_ADMIN_PASSWORD}
    volumes:
      - cups_logs:/var/log/cups
      - cups_spool:/var/spool/cups
    restart: unless-stopped

  backend:
    build: ./backend
    shm_size: "256mb"
    env_file: .env
    environment:
      DB_PATH: ${DB_PATH:-/app/data/printwatch.db}
      LOG_PATH: ${LOG_PATH:-/var/log/cups/page_log}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost,http://VM_HOST}
      API_TIMEZONE: ${API_TIMEZONE:-America/Sao_Paulo}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}
      FLEET_HEALTH_INTERVAL_SEC: ${FLEET_HEALTH_INTERVAL_SEC:-900}
      FLEET_SNMP_INTERVAL_SEC: ${FLEET_SNMP_INTERVAL_SEC:-43200}
      CUPS_HOST: ${CUPS_HOST:-cups}
      CUPS_PORT: ${CUPS_PORT:-631}
      SIMPRESS_ENABLED: ${SIMPRESS_ENABLED:-true}
      SIMPRESS_DB_PATH: ${SIMPRESS_DB_PATH:-/app/data/simpress.db}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SIMPRESS_DOCS_PATH: ${SIMPRESS_DOCS_PATH:-/app/data/simpress_docs}
    volumes:
      - cups_logs:/var/log/cups:ro
      - db_data:/app/data
    restart: unless-stopped
    depends_on:
      - cups

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cups_logs:
  cups_spool:
  db_data:
